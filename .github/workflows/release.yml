# Publica @dotrino/terminal-agent (la carpeta agent/) DESDE CI, no desde el portátil de nadie.
#
# Sin token: npm cambia un credencial efímero por la identidad OIDC de esta ejecución
# (publicación de confianza) y firma la procedencia él solo. La confianza se declara en
# npm, por paquete, con:
#   npm trust github @dotrino/terminal-agent --file release.yml --repo imdotrino/dotrino-terminal
# **El nombre de este archivo tiene que coincidir exacto.**
#
# Se dispara con un tag `agent-vX.Y.Z` (este repo también tiene la PWA, que se despliega
# por deploy.yml con cada push a main). Y un SBOM por release (CUMPLIMIENTO.md §2).
name: Release agent

on:
  push:
    tags: ['agent-v*']

permissions:
  contents: write      # crear la release y subirle el SBOM
  id-token: write      # OIDC: la publicación de confianza y la atestación
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La publicación de confianza pide npm ≥11.5.1; Node 22 trae npm 10, por eso se sube.
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
          registry-url: https://registry.npmjs.org

      - run: npm i -g npm@latest
      - run: npm ci

      # El tag tiene que decir la misma versión que el package.json: si no, se publicaría
      # una versión con los artefactos colgados de otra release.
      - name: El tag coincide con la versión
        run: test "agent-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # LAS PRUEBAS ANTES DE PUBLICAR. Una versión que no pasa su suite no llega a npm.
      - run: npm test
      # El registro de compatibilidad (dotrino-roadmap, CONVENCIONES §14): nada instalado en
      # una versión marcada rota ni por debajo de lo que exige la ficha. Con @latest, que trae
      # la lista de rotas más nueva. Va antes de publicar: aquí sí frena.
      - run: npx --yes @dotrino/roadmap@latest check

      - name: SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@latest \
            --omit dev --output-format JSON \
            --output-file "sbom-terminal-agent-$(node -p "require('./package.json').version").cdx.json"

      - name: Atestiguar el SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'agent/sbom-*.cdx.json'

      # LO QUE SE PUBLICA ES LO QUE SE MIDIÓ (CONVENCIONES §15). El agente instalado se
      # actualiza solo, y antes comprueba que el tarball que le da npm cuadra con el hash que
      # esta release adjunta (`npm-integrity.json`): por eso se empaqueta UNA vez, se mide ese
      # archivo y se publica ESE archivo, byte a byte.
      - name: Empaquetar
        run: npm pack
      - name: Medir lo que se va a publicar
        run: npx --yes @dotrino/update@latest integrity ./*.tgz > npm-integrity.json
      - name: Publicar en npm ESE archivo
        run: npm publish ./*.tgz --access public

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agent/sbom-*.cdx.json
            agent/npm-integrity.json
          generate_release_notes: true
          # «Latest» es la de la app de escritorio: la portada descarga de releases/latest, y
          # esta release no trae instaladores (el agente va por npm).
          make_latest: false
