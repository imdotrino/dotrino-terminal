# La app de escritorio compila en Windows con cada cambio, y deja el .zip como artefacto para
# probarlo antes de publicar (la release la hace desktop.yml con un tag `desktop-v*`).
name: Desktop on Windows

on:
  push:
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $d = "dotrino-terminal-desktop-$v-windows-x64"
          New-Item -ItemType Directory -Force "dist/$d" | Out-Null
          Copy-Item target/release/dotrino-terminal-desktop.exe "dist/$d/"
          Compress-Archive -Path "dist/$d" -DestinationPath "dist/$d.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/*.zip
