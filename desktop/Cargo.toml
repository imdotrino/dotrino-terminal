[package]
name = "dotrino-terminal-desktop"
version = "0.2.76"
edition = "2024"
description = "Dotrino Terminal: terminal windows (Linux, macOS, Windows) whose consoles you can also open from your other devices."
license = "MIT"
repository = "https://github.com/imdotrino/dotrino-terminal"
homepage = "https://terminal.dotrino.com/"

[dependencies]
iced = { version = "0.14", features = ["tokio", "advanced", "svg"] }
iced_aw = { version = "0.14", default-features = false, features = ["menu", "context_menu"] }
iced_term = "0.8"
libc = "0.2"
open = "5"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["time"] }

# Windows: mirar si el agente contestó por su tubería sin quedarse colgado (PeekNamedPipe) y
# el idioma de la interfaz (no hay LANG).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Pipes"] }

[patch.crates-io]
# Un método público más (ver vendor/README.md).
iced_term = { path = "vendor/iced_term" }
# Un pánico al dar foco con un menú de clic secundario abierto (ver vendor/README.md).
iced_aw = { path = "vendor/iced_aw" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo deb`: el paquete de Linux. El cliente (`dotrino-terminal`) viene de npm
# (`@dotrino/terminal-agent`), así que no es una dependencia del .deb: la app lo busca y, si
# no está, lo dice en la ventana.
[package.metadata.deb]
maintainer = "Dotrino <sandrade@dotrino.com>"
section = "utils"
# La ventana carga estas librerías al arrancar (no enlazadas: `$auto` no las ve). Sin ellas la
# app no abre en un sistema mínimo.
depends = "$auto, libxcursor1, libxi6, libxrandr2, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
extended-description = "Each window runs dotrino-terminal (npm: @dotrino/terminal-agent). Install it with: npm install -g @dotrino/terminal-agent"
assets = [
  ["target/release/dotrino-terminal-desktop", "usr/bin/", "755"],
  ["assets/dotrino-terminal.desktop", "usr/share/applications/", "644"],
  # XFCE: para poder elegirla en «Aplicaciones preferidas → Emulador de terminal» (y que
  # «Abrir terminal aquí» de Thunar la abra en la carpeta).
  ["assets/xfce-helper-dotrino-terminal.desktop", "usr/share/xfce4/helpers/dotrino-terminal.desktop", "644"],
  ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/dotrino-terminal.svg", "644"],
  ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/dotrino-terminal.png", "644"],
]

# `cargo generate-rpm`: el mismo paquete para Fedora, RHEL y openSUSE, con los mismos archivos
# que el .deb. Las dependencias salen del binario (`builtin` = lo que dice `ldd`), sin `rpmbuild`.
[package.metadata.generate-rpm]
summary = "Dotrino Terminal: terminal windows whose consoles you can also open from your other devices"
auto-req = "builtin"
# Lo que la ventana carga al arrancar y `ldd` no ve: sin esto, en un Fedora mínimo la app se
# instalaba y no abría (`libXcursor.so.1: cannot open shared object file`).
requires = { libXcursor = "*", libXi = "*", libXrandr = "*", libxkbcommon = "*", libxkbcommon-x11 = "*", libwayland-client = "*" }
assets = [
  { source = "target/release/dotrino-terminal-desktop", dest = "/usr/bin/dotrino-terminal-desktop", mode = "755" },
  { source = "assets/dotrino-terminal.desktop", dest = "/usr/share/applications/dotrino-terminal.desktop", mode = "644" },
  { source = "assets/xfce-helper-dotrino-terminal.desktop", dest = "/usr/share/xfce4/helpers/dotrino-terminal.desktop", mode = "644" },
  { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dotrino-terminal.svg", mode = "644" },
  { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/dotrino-terminal.png", mode = "644" },
]
