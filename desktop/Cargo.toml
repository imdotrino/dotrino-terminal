[package]
name = "dotrino-terminal-desktop"
version = "0.1.7"
edition = "2024"
description = "Dotrino Terminal: terminal windows (Linux, macOS) whose consoles you can also open from your other devices."
license = "MIT"
repository = "https://github.com/imdotrino/dotrino-terminal"
homepage = "https://terminal.dotrino.com/"

[dependencies]
iced = { version = "0.14", features = ["tokio", "advanced"] }
iced_aw = { version = "0.14", default-features = false, features = ["menu"] }
iced_term = "0.8"
libc = "0.2"
open = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[patch.crates-io]
# Un método público más (ver vendor/README.md).
iced_term = { path = "vendor/iced_term" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `cargo deb`: el paquete de Linux. El cliente (`dotrino-terminal`) viene de npm
# (`@dotrino/terminal-agent`), así que no es una dependencia del .deb: la app lo busca y, si
# no está, lo dice en la ventana.
[package.metadata.deb]
maintainer = "Dotrino <sandrade@dotrino.com>"
section = "utils"
depends = "$auto"
extended-description = "Each window runs dotrino-terminal (npm: @dotrino/terminal-agent). Install it with: npm install -g @dotrino/terminal-agent"
assets = [
  ["target/release/dotrino-terminal-desktop", "usr/bin/", "755"],
  ["assets/dotrino-terminal.desktop", "usr/share/applications/", "644"],
  # XFCE: para poder elegirla en «Aplicaciones preferidas → Emulador de terminal» (y que
  # «Abrir terminal aquí» de Thunar la abra en la carpeta).
  ["assets/xfce-helper-dotrino-terminal.desktop", "usr/share/xfce4/helpers/dotrino-terminal.desktop", "644"],
  ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/dotrino-terminal.svg", "644"],
  ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/dotrino-terminal.png", "644"],
]
