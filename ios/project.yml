# Terminal para iOS: la versión NATIVA de terminal.dotrino.com (CONVENCIONES §16). La PWA va
# delante; MARKETING_VERSION es la versión de la PWA con la que esta está a la par (§16.3).
#
# XcodeGen → `xcodegen generate` crea Terminal.xcodeproj en la Mac (el .xcodeproj no se commitea).
#
#   cd ios && xcodegen generate
#   xcodebuild -project Terminal.xcodeproj -scheme Terminal -destination 'platform=iOS Simulator,name=iPhone 17' test
#
# Firma: equipo DOTRINO S.A.S. (P7G853375S), automática, con los grupos compartidos del
# ecosistema (dotrino-native/docs/DISENO.md §2.1): el perfil es el mismo de las demás apps.
name: Terminal
options:
  bundleIdPrefix: com.dotrino
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: P7G853375S
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.8.14
    CURRENT_PROJECT_VERSION: 27
packages:
  # La librería nativa del ecosistema: el repo dotrino-native, como submódulo en ../native
  # (igual que Android). Perfil, transporte, el cliente del agente y la barra compartida.
  DotrinoNative:
    path: ../native
targets:
  Terminal:
    type: application
    platform: iOS
    sources: [Terminal]
    dependencies:
      - package: DotrinoNative
        product: DotrinoNative
      - package: DotrinoNative
        product: DotrinoNativeUI
      - package: DotrinoNative
        product: DotrinoNativeWebRTC
    info:
      path: Terminal/Info.plist
      properties:
        CFBundleDisplayName: Terminal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        ITSAppUsesNonExemptEncryption: false
        # La hoja de perfil (dotrino-native) lee el QR de la bóveda al adoptar un perfil.
        NSCameraUsageDescription: "Para escanear el código de emparejamiento de tu bóveda."
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
    entitlements:
      path: Terminal/Terminal.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.dotrino.shared"]
        com.apple.security.application-groups: [group.com.dotrino]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dotrino.terminal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TerminalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TerminalTests]
    dependencies:
      - target: Terminal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Terminal.app/Terminal"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TerminalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TerminalUITests]
    dependencies:
      - target: Terminal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Terminal

schemes:
  Terminal:
    build:
      targets:
        Terminal: all
    test:
      targets: [TerminalTests, TerminalUITests]
